mixed-port: 7890
allow-lan: false
mode: rule
ipv6: true
log-level: info
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  nameserver-policy:
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://1.1.1.1/dns-query#PROXY, https://1.0.0.1/dns-query#PROXY]
  fallback: [https://1.1.1.1/dns-query#PROXY, https://1.0.0.1/dns-query#PROXY]
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: [gfw]
    ipcidr: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/8, 224.0.0.0/4]
  fake-ip-filter: ['*.lan', '*.local', 'localhost', '+.home.arpa', 'time.*.com']
proxies: []
proxy-groups:
  - name: PROXY
    type: select
    proxies: [DIRECT]
rule-providers:
  ai_ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://raw.githubusercontent.com/coutureone/Shadowrocket/master/Shadowrocket/Clash/rules/ai_ip.yaml
    path: ./rules/ai_ip.yaml
    interval: 86400
  ai_non_ip:
