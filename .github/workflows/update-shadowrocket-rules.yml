name: Update Shadowrocket rules

on:
  schedule:
    # Run after the daily upstream sync. Shared concurrency prevents overlap.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-maintenance-master
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'coutureone/Surge'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Convert Sukka rules for Shadowrocket
        run: node Shadowrocket/scripts/update-rules.mjs

      - name: Commit updated rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shadowrocket/Rules

          if git diff --cached --quiet; then
            echo "Shadowrocket rules are already up to date."
            exit 0
          fi

          git commit -m "Update converted Shadowrocket rules"
          git push origin master
