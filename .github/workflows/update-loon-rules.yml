name: Update Loon rules

on:
  schedule:
    # Run after upstream sync (03:17 UTC) and Shadowrocket update (03:47 UTC).
    - cron: '07 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-maintenance-master
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'coutureone/Shadowrocket'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Convert Sukka rules for Loon
        run: node Loon/scripts/update-rules.mjs

      - name: Validate Loon rule files
        run: node Loon/scripts/validate-rules.mjs

      - name: Commit updated rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loon/Rules

          if git diff --cached --quiet; then
            echo "Loon rules are already up to date."
            exit 0
          fi

          git commit -m "Update converted Loon rules"
          git push origin master
